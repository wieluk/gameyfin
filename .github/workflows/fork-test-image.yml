# Builds a container image from a branch of this fork and publishes it to the fork's own
# registry, so a change can be tried on a real server before it is proposed upstream.
#
# Lives on the default branch because that is the only place GitHub looks when deciding
# which workflows to offer under "Run workflow". The branch to build is an input rather
# than the ref this runs from, so feature branches stay free of fork-only CI.
name: Fork test image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'feature/save-sync'
      tag:
        description: 'Image tag to publish'
        required: true
        default: 'save-sync'

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The test-report step creates a check run.
      checks: write

    steps:
      - name: Check out the branch being built
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # A production build refuses to run unless the bundled plugins can be signed, and the
      # keystore password is an upstream secret no fork has. Both halves of the trust chain
      # are in the tree though: the keystore that signs, and the certificate the server
      # checks against. Replacing both with a throwaway pair keeps them consistent, so the
      # plugins in this image verify as official and start on their own.
      #
      # The pair lives only on the runner. Never commit it, and do not mix plugin jars
      # between an image built this way and an official one: neither will trust the other.
      - name: Generate a throwaway plugin signing key
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 24)"
          rm -f certs/gameyfin.jks
          keytool -genkeypair -noprompt \
            -keystore certs/gameyfin.jks -alias gameyfin-plugins \
            -storepass "$password" -keypass "$password" \
            -dname "CN=Gameyfin Fork Test Build, O=Unofficial" \
            -keyalg RSA -keysize 2048 -validity 370
          keytool -exportcert -rfc \
            -keystore certs/gameyfin.jks -alias gameyfin-plugins \
            -storepass "$password" \
            > app/src/main/resources/certificates/gameyfin-plugins.pem
          echo "::add-mask::$password"
          echo "GAMEYFIN_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"

      # The Dockerfile copies a prebuilt jar rather than compiling, so this has to run first.
      - name: Run production build
        run: ./gradlew clean build -Pvaadin.productionMode=true

      - name: Publish the test report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: this is for trying a branch out, and arm64 doubles the build for nothing.
      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: docker/Dockerfile.ubuntu
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gameyfin:${{ inputs.tag }}
          cache-from: type=gha,scope=fork-test-image
          cache-to: type=gha,mode=max,scope=fork-test-image

      - name: Say where it went
        run: |
          {
            echo "### Image published"
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/gameyfin:${{ inputs.tag }}"
            echo '```'
            echo "Built from \`${{ inputs.branch }}\`."
            echo ""
            echo "New packages are private by default. Make it public under Packages, or run \`docker login ghcr.io\` where you pull it."
          } >> "$GITHUB_STEP_SUMMARY"
