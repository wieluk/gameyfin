# Builds the fork's container image from integration/gameyfin-app on every push and publishes
# it to the fork's own registry. Fork-only, so it lives here: main mirrors upstream and the
# feature branches stay ready for upstream PRs.
#
# "Run workflow" only lists workflows on the default branch, so a manual run needs this
# branch to be the default one.
name: Fork test image

on:
  push:
    branches:
      - 'integration/gameyfin-app'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish'
        required: true
        default: 'gameyfin-app'

# Only the newest commit matters, so a push cancels the build of the one before.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_TAG: ${{ inputs.tag || 'gameyfin-app' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The test-report step creates a check run.
      checks: write

    steps:
      - name: Check out the commit being built
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # A production build refuses to run unless the bundled plugins can be signed, and the
      # keystore password is an upstream secret no fork has. Both halves of the trust chain
      # are in the tree though: the keystore that signs, and the certificate the server
      # checks against. Replacing both with a throwaway pair keeps them consistent, so the
      # plugins in this image verify as official and start on their own.
      #
      # The pair lives only on the runner. Never commit it, and do not mix plugin jars
      # between an image built this way and an official one: neither will trust the other.
      - name: Generate a throwaway plugin signing key
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 24)"
          rm -f certs/gameyfin.jks
          keytool -genkeypair -noprompt \
            -keystore certs/gameyfin.jks -alias gameyfin-plugins \
            -storepass "$password" -keypass "$password" \
            -dname "CN=Gameyfin Fork Test Build, O=Unofficial" \
            -keyalg RSA -keysize 2048 -validity 370
          keytool -exportcert -rfc \
            -keystore certs/gameyfin.jks -alias gameyfin-plugins \
            -storepass "$password" \
            > app/src/main/resources/certificates/gameyfin-plugins.pem
          echo "::add-mask::$password"
          echo "GAMEYFIN_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"

      # The Dockerfile copies a prebuilt jar rather than compiling, so this has to run first.
      - name: Run production build
        run: ./gradlew clean build -Pvaadin.productionMode=true

      - name: Publish the test report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: this is for trying a branch out, and arm64 doubles the build for nothing.
      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: docker/Dockerfile.ubuntu
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gameyfin:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=fork-test-image
          cache-to: type=gha,mode=max,scope=fork-test-image

      - name: Say where it went
        run: |
          {
            echo "### Image published"
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/gameyfin:${{ env.IMAGE_TAG }}"
            echo '```'
            echo "Built from \`${{ github.ref_name }}\` at \`${{ github.sha }}\`."
            echo ""
            echo "New packages are private by default. Make it public under Packages, or run \`docker login ghcr.io\` where you pull it."
          } >> "$GITHUB_STEP_SUMMARY"
